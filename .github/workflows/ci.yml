name: CI

# Validate every push/PR without publishing: a fast torch-free sanity check plus
# unsigned launcher builds on all three platforms (catches PyInstaller breakage).
# Signing, notarization, and the published Release live in release.yml (tags only).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The launcher installs from requirements*.lock, so editing requirements*.txt
  # without regenerating does nothing at all: you would believe a pin landed while
  # every user kept the old version. Recompiling without --upgrade keeps existing
  # pins, so this only goes red when a .lock genuinely disagrees with its .txt,
  # never because some dependency published a new release.
  locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locks match their constraints
        run: |
          bash scripts/lock-deps.sh
          if ! git diff --quiet -- requirements.lock requirements-gpu.lock requirements-dml.lock; then
            echo "::error::requirements*.lock is stale. Run scripts/lock-deps.sh and commit the result."
            git diff -- requirements.lock requirements-gpu.lock requirements-dml.lock
            exit 1
          fi
          echo "Locks are in sync with their .txt constraints."

  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the TUI toolkit (no torch)
        run: pip install -e ./libs/chotic-ui

      - name: Parse, import, and list
        run: |
          python -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('src/**/*.py', recursive=True) + ['stemchotic.py', 'launcher.py']]; print('parse ok')"
          python -c "from src.screens import stem_picker, model_picker; from src.core import engines, separator, model_cache, registry, progress; print('imports ok')"
          python stemchotic.py --list

  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build app.zip
        run: |
          git ls-files | grep -v '^libs/chotic-ui$' | zip -q app.zip -@
          (cd libs/chotic-ui && git ls-files | sed 's|^|libs/chotic-ui/|') | zip -q app.zip -@
          echo "ci-${GITHUB_SHA::7}" > .version && zip -q app.zip .version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip

  launcher:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact: Stemchotic-macos
          - os: windows-latest
            name: windows
            artifact: Stemchotic.exe
          - os: ubuntu-latest
            name: linux
            artifact: Stemchotic-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller certifi

      - name: Build launcher (macOS, unsigned)
        if: matrix.name == 'macos'
        run: |
          CERTIFI_PATH=$(python -c "import certifi; print(certifi.where())")
          pyinstaller --onefile --name Stemchotic-macos --clean --noconfirm \
            --add-data "$CERTIFI_PATH:certifi" \
            --hidden-import certifi \
            launcher.py

      - name: Build launcher (Windows)
        if: matrix.name == 'windows'
        run: |
          $CERTIFI_PATH = python -c "import certifi; print(certifi.where())"
          pyinstaller --onefile --name Stemchotic --clean --noconfirm `
            --icon packaging/windows/stemchotic.ico `
            --add-data "$CERTIFI_PATH;certifi" `
            --add-data "packaging/macos/wezterm.lua;." `
            --hidden-import certifi `
            launcher.py
        shell: pwsh

      - name: Build launcher (Linux)
        if: matrix.name == 'linux'
        run: |
          CERTIFI_PATH=$(python -c "import certifi; print(certifi.where())")
          pyinstaller --onefile --name Stemchotic-linux --clean --noconfirm \
            --add-data "$CERTIFI_PATH:certifi" \
            --add-data "packaging/linux/stemchotic.png:." \
            --hidden-import certifi \
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
