name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Cheap asserts that fail the release before anything is built or published.
  # Each one guards a mistake that is only visible after the release is public.
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag, version and changelog agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # release.yml takes the version from the tag while dev-release.yml takes it
          # from src/__init__.py; if they disagree the two channels disagree about
          # what version they are.
          DECLARED="$(grep -oE '__version__ = "[^"]+"' src/__init__.py | cut -d'"' -f2)"
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::tag is v${VERSION} but src/__init__.py says ${DECLARED}"
            exit 1
          fi

          # Without a matching section the publish step silently falls back to
          # --generate-notes, shipping a raw commit list as the release notes.
          if ! awk -v v="## ${VERSION}" '$0==v{found=1} END{exit !found}' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section"
            exit 1
          fi

          echo "v${VERSION}: version and changelog agree."

  app:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build app.zip
        run: |
          git ls-files | grep -v '^libs/chotic-ui$' | zip -q app.zip -@
          (cd libs/chotic-ui && git ls-files | sed 's|^|libs/chotic-ui/|') | zip -q app.zip -@
          echo "${GITHUB_REF_NAME#v}" > .version && zip -q app.zip .version

      # The launcher installs from these; an app.zip without them sends every user
      # down the loose-constraints fallback path, which is what the locks exist to
      # prevent. `git ls-files` drives the zip, so this catches them being
      # uncommitted or gitignored.
      - name: Locks are actually in the zip
        run: |
          for f in requirements.lock requirements-gpu.lock requirements-dml.lock; do
            unzip -l app.zip | grep -q " $f$" || { echo "::error::app.zip is missing $f"; exit 1; }
          done
          echo "All three locks present in app.zip."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip

  launcher:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact: Stemchotic.dmg
          - os: windows-latest
            name: windows
            artifact: Stemchotic.exe
          - os: ubuntu-latest
            name: linux
            artifact: Stemchotic

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check for Apple signing secrets
        if: matrix.name == 'macos'
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_APPLICATION }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::Apple signing secrets not configured, building unsigned"
          fi

      - name: Import Apple certificate
        if: matrix.name == 'macos' && steps.signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_APPLICATION }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          curl -sO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          # The .p12 already bundles the Developer ID G2 intermediate, so this is
          # best-effort: tolerate "already exists" instead of failing the build.
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH" || true

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "APP_IDENTITY=Developer ID Application: Noah Baxter ($APPLE_TEAM_ID)" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller certifi

      - name: Build, sign and notarize the macOS app (DMG)
        if: matrix.name == 'macos' && steps.signing.outputs.available == 'true'
        env:
          PYTHON: python
          MACOS_SIGN_IDENTITY: ${{ env.APP_IDENTITY }}
          NOTARY_PROFILE: notarytool-profile
        run: |
          bash packaging/macos/build_app.sh      # assemble Stemchotic.app (launcher + WezTerm)
          bash packaging/macos/sign_and_dmg.sh   # Developer ID sign + notarize + DMG

      - name: Build launcher (Windows)
        if: matrix.name == 'windows'
        run: |
          $CERTIFI_PATH = python -c "import certifi; print(certifi.where())"
          pyinstaller --onefile --name Stemchotic --clean --noconfirm `
            --icon packaging/windows/stemchotic.ico `
            --add-data "$CERTIFI_PATH;certifi" `
            --add-data "packaging/macos/wezterm.lua;." `
            --hidden-import certifi `
            launcher.py
        shell: pwsh

      - name: Build launcher (Linux)
        if: matrix.name == 'linux'
        run: |
          CERTIFI_PATH=$(python -c "import certifi; print(certifi.where())")
          pyinstaller --onefile --name Stemchotic --clean --noconfirm \
            --add-data "$CERTIFI_PATH:certifi" \
            --add-data "packaging/linux/stemchotic.png:." \
            --hidden-import certifi \
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Clean up keychain
        if: matrix.name == 'macos' && always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  release:
    needs: [app, launcher]
    # Publish whatever built, even if one platform failed (e.g. macOS notarization
    # blocked by an Apple agreement). app.zip is required; the rest are added if
    # present, and a re-run later fills in any missing platform asset.
    if: ${{ always() && needs.app.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # for CHANGELOG.md (release notes source)

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"

          ASSETS=()
          for f in \
            artifacts/app/app.zip \
            artifacts/Stemchotic.dmg/Stemchotic.dmg \
            artifacts/Stemchotic.exe/Stemchotic.exe \
            artifacts/Stemchotic/Stemchotic; do
            [ -f "$f" ] && ASSETS+=("$f") || echo "::warning::missing asset $f (skipped)"
          done

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release $TAG..."
            # Publish the CHANGELOG section for this version; fall back to
            # generated notes only if no section exists.
            VERSION="${TAG#v}"
            awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              gh release create "$TAG" --notes-file notes.md "${ASSETS[@]}"
            else
              echo "::warning::no CHANGELOG.md section for ${VERSION}; using generated notes"
              gh release create "$TAG" --generate-notes "${ASSETS[@]}"
            fi
          fi

      - name: Upload to R2 CDN
        # Mirrors the stable "latest" keys the download worker points at
        # (cdn.dichoticstudios.com/stemchotic/*). Skips any platform that
        # didn't build so a partial release still publishes what it has.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://ee4f7641599153d817b6bddbea5483e7.r2.cloudflarestorage.com
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::R2 secrets not set — skipping CDN upload (add R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY)"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          upload() {  # <src> <key> <content-type> <download-filename>
            [ -f "$1" ] || { echo "::warning::missing $1 (skipped R2 upload)"; return 0; }
            aws s3 cp "$1" "s3://dichotic-plugins/stemchotic/$2" \
              --content-type "$3" \
              --content-disposition "attachment; filename=$4" \
              --endpoint-url "$AWS_ENDPOINT_URL" --region auto
          }
          upload artifacts/Stemchotic.dmg/Stemchotic.dmg Stemchotic-macOS.dmg   application/x-apple-diskimage "Stemchotic-${VERSION}-macOS.dmg"
          upload artifacts/Stemchotic.exe/Stemchotic.exe Stemchotic-Windows.exe application/octet-stream       "Stemchotic-${VERSION}-Windows.exe"
          upload artifacts/Stemchotic/Stemchotic         Stemchotic-Linux       application/octet-stream       "Stemchotic-${VERSION}-Linux"
